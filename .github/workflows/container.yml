name: Build Container

on:
  push:
    branches: [main]

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | nix run nixpkgs#skopeo -- login \
            --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Push the container
        run: nix run .#container.copyToRegistry
